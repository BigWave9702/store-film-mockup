:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0e0e13;--card:#16161d;--fg:#ececf2;--muted:#1e1e27;--mfg:#9a9aaa;--bd:#2a2a35;--inp:#3a3a48;
--a-adm:#8f8bf5;--as-adm:#23224a;--a-pub:#3fc2ac;--as-pub:#103833;--accent-fg:#0e0e13;--ring:#5b57c9;
--ok:#4cc77a;--okb:#14301f;--warn:#e8b048;--warnb:#3a2c0e;--bad:#f27b7b;--badb:#3d1a1a;--info:#7ea6ff;--infob:#18264a;
--adjb:#33290e;--adjl:#b88a1d;--side:#12121a;--shadow:none;--c1:#8f8bf5;--c2:#3fc2ac;--c3:#e8a054;--grid:#262632;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0e0e13;--card:#16161d;--fg:#ececf2;--muted:#1e1e27;--mfg:#9a9aaa;--bd:#2a2a35;--inp:#3a3a48;
--a-adm:#8f8bf5;--as-adm:#23224a;--a-pub:#3fc2ac;--as-pub:#103833;--accent-fg:#0e0e13;--ring:#5b57c9;
--ok:#4cc77a;--okb:#14301f;--warn:#e8b048;--warnb:#3a2c0e;--bad:#f27b7b;--badb:#3d1a1a;--info:#7ea6ff;--infob:#18264a;
--adjb:#33290e;--adjl:#b88a1d;--side:#12121a;--shadow:none;--c1:#8f8bf5;--c2:#3fc2ac;--c3:#e8a054;--grid:#262632;color-scheme:dark}

.cb{width:15px;height:15px;accent-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow)}

.badge.ok{background:var(--okb);color:var(--ok)} .badge.warn{background:var(--warnb);color:var(--warn)} .badge.bad{background:var(--badb);color:var(--bad)}
.badge.info{background:var(--infob);color:var(--info)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.adj{background:var(--adjb);color:var(--warn);box-shadow:inset 0 0 0 1px var(--adjl)}
.badge.lock{background:var(--fg);color:var(--bg)}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:var(--radius);border:1px solid var(--bd);background:var(--card);font-size:12.5px}
.alert.info{background:var(--infob);border-color:transparent} .alert.warn{background:var(--warnb);border-color:transparent;color:var(--warn)}
.alert.bad{background:var(--badb);border-color:transparent;color:var(--bad)} .alert.ok{background:var(--okb);border-color:transparent;color:var(--ok)}
.alert .ic{margin-top:2px} .alert b{display:block}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);overflow:auto}

.tab:hover{color:var(--fg)} .tab.on{color:var(--accent);border-color:var(--accent)}
/* filter */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px}

.seg{display:inline-flex;border:1px solid var(--inp);border-radius:var(--radius);overflow:hidden;background:var(--card)}

.ms-ph{color:var(--mfg)} .chip{display:inline-flex;align-items:center;gap:3px;background:var(--muted);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-p{position:absolute;z-index:40;left:0;top:calc(100% + 4px);width:max(100%,290px);background:var(--card);border:1px solid var(--bd);border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:6px}
.ms-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}

.ms-o:hover{background:var(--muted)} .ms-o small{color:var(--mfg);margin-left:auto}
/* table */
.tw{overflow:auto;max-width:100%;max-height:640px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}

td.r,th.r{text-align:right} 
tr.adj td{background:var(--adjb)} tr.adj td:first-child{box-shadow:inset 3px 0 0 var(--adjl)}
tr.tot td{font-weight:700;background:var(--muted)}
tr.nest>td{padding:0;background:var(--bg)}
.nestw{padding:10px 12px 12px 44px}
.tbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--bd);color:var(--mfg);font-size:12.5px;flex-wrap:wrap}
.dd{position:relative} .ddp{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:6px;min-width:190px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.ddp label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer} .ddp label:hover{background:var(--muted)}
.skel{background:linear-gradient(90deg,var(--muted),var(--bd),var(--muted));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:5px;height:14px}

.empty{padding:44px 16px;text-align:center;color:var(--mfg);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{color:var(--fg);font-size:14px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{padding:13px 15px} .kpi .l{color:var(--mfg);font-size:12px;font-weight:600} .kpi .v{font-size:22px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em} .kpi .s{font-size:12px;color:var(--mfg);margin-top:1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mfg);flex-wrap:wrap} .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.hb .bar{height:8px;background:var(--muted);border-radius:9px;overflow:hidden} .hb .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.prog{height:6px;background:var(--muted);border-radius:9px;overflow:hidden;min-width:70px} .prog i{display:block;height:100%;background:var(--accent)}

.chain{display:flex;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}

.chain div:last-child{border:0}

.chain div:last-child::after{display:none}
.chain .done{color:var(--fg)} .chain .cur{background:var(--accent-soft);color:var(--accent)} .chain .cur::after{background:var(--accent-soft)}

.link{color:var(--accent);background:none;border:0;padding:0;font-weight:600;text-align:left} .link:hover{text-decoration:underline}

.url{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
/* overlays */
.bk{position:fixed;inset:0;background:rgba(10,10,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}

<div id="app"></div><div id="ov"></div><div id="toasts" class="toasts" aria-live="polite"></div><div id="dev"></div>

 <div>${kvH([['Mã ẩn danh',`<span class="mono">${g.an}</span>`],['Người dùng',g.user?`<span class="mono">#${g.user}</span> <span class="mut sm">cập nhật khi định danh, không đổi attribution</span>`:'Chưa định danh'],['Publisher được gán',adm?goB('a-pub-d',{id:p.id},p.ten):p.ten],['Chiến dịch',adm?goB('a-camp-d',{id:c.id},c.ten):c.ten],['Lần gán chiến dịch',`#${a.id} · gán ${dmy(a.gan)} ${bAsg(a.st)}`],['Link tạo attribution',`<span class="mono">${l.code}</span> · ${MOVm[l.m].ten}<div class="mono sm mut" style="overflow-wrap:anywhere">${l.url}</div>`],['Nguồn đầu',g.nguon]])}</div>
 <div><h3 style="margin-bottom:8px">${adm?'Các lần nhấp của mã ẩn danh này':'Lần nhấp qua link của bạn'}</h3>${mini([{t:'Thời gian',f:x=>dmyhm(x.ts)},{t:'Publisher',f:x=>PUBm[x.l.p].ten},{t:'Mã theo dõi',f:x=>`<span class="mono">${x.l.code}</span>`},{t:'Kết quả',f:x=>x.first?B('Chốt first-click','ok'):B('Không đổi attribution')}],clicks)}</div>
 <div><h3 style="margin-bottom:8px">Chuyển đổi và hoa hồng (${cvs.length})</h3>${cvs.length?mini([{t:'Thời gian',f:x=>dmyhm(x.ts)},{t:'Loại',f:x=>bEv(2+x.loai)},{t:'Net',r:1,f:x=>vnd(x.net)},{t:'Hoa hồng',r:1,f:x=>{const t=TX.find(y=>y.cv===x.id);return t?`<button class="link mono" data-act="txs" data-id="${t.id}">#${t.id}</button> ${vnd(t.amt)}`:'—'}}],cvs):'<div class="mut">Chưa phát sinh chuyển đổi trong cửa sổ quy gán.</div>'}</div>
 ${adm?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="toclick" data-id="${g.id}">${ic('click','sm')} Lượt nhấp của link này</button><button class="btn" data-act="toattrp" data-id="${g.id}">Gắn kết cùng publisher</button></div>`:''}</div>`)}
Object.assign(act,{attr:el=>attrSheet(Number(el.dataset.id)),
 toclick:el=>{const g=GK[el.dataset.id-1];goF('a-click','a-click',{preset:'custom',from:addDays(TODAY,-29),to:TODAY,pub:[g.p],camp:[g.c],mov:[g.m]})},
 toattrp:el=>{const g=GK[el.dataset.id-1];toAttr({pub:[g.p],camp:[g.c]})},
 attrpc:el=>toAttr({pub:[Number(el.dataset.p)],camp:[Number(el.dataset.c)]}),
 attrp:el=>toAttr({pub:[Number(el.dataset.p)]})});

RT['p-attr']=RT['a-attr'];
/* ================= ĐĂNG KÝ CHẠY CHIẾN DỊCH (publisher đăng ký -> admin duyệt -> gán + sinh link) ================= */
const REG_ST=['Chờ duyệt','Đã duyệt','Bị từ chối','Đã rút'];
const bReg=s=>B(REG_ST[s],['warn','ok','bad',''][s]);
const regOf=(p,c)=>REG.filter(r=>r.p===p&&r.c===c).sort((a,b)=>b.ts-a.ts)[0];
const regPendN=c=>REG.filter(r=>r.st===0&&(c==null||r.c===c)).length;
const regOpen=c=>c.st===1&&c.bd<=TODAY&&(!c.kt||c.kt>=TODAY);
const regEnded=c=>c.st===2||!!(c.kt&&c.kt<TODAY);
const regWhy=c=>c.st!==1?'Chiến dịch không ở trạng thái đang chạy.':c.bd>TODAY?'Chiến dịch bắt đầu từ '+ysd(c.bd)+', chưa tới ngày mở đăng ký.':'Chiến dịch đã kết thúc ngày '+ysd(c.kt)+'.';
const REG_FLOW=['Xem chính sách','Gửi đăng ký','Admin duyệt','Nhận link theo dõi','Chạy và nhận hoa hồng'];
function regState(c){const mine=myAsg().find(x=>x.c===c.id&&x.st);if(mine)return{k:'mine',idx:4,b:B('Đã được gán','ok')};const r=regOf(S.user.pid,c.id);
 if(r&&r.st===0)return{k:'pend',idx:2,r,b:B('Chờ duyệt đăng ký','warn')};if(r&&r.st===2)return{k:'rej',idx:1,r,b:B('Đăng ký bị từ chối','bad')};return{k:'none',idx:0,r,b:regOpen(c)?B('Chưa được gán'):regEnded(c)?B('Không đăng ký'):B('Chưa mở đăng ký')}}
function regCard(c){const s=regState(c),r=s.r;
 return `<div class="card"><div class="ch"><div><h2>Đăng ký chạy chiến dịch</h2><p>Publisher gửi đăng ký, quản trị viên duyệt. Khi được duyệt, hệ thống gán chiến dịch và sinh link theo dõi cho từng nội dung phim.</p></div>${s.b}</div><div class="cp" style="display:flex;flex-direction:column;gap:12px">${chainL(REG_FLOW,s.idx)}
 ${s.k==='none'?(regOpen(c)?alertB('Bạn chưa chạy chiến dịch này','Đọc chính sách hoa hồng bên dưới rồi bấm “Đăng ký chạy chiến dịch”. Quản trị viên sẽ xem xét đăng ký của bạn.','info','info'):alertB(regEnded(c)?'Bạn không đăng ký chiến dịch này':'Chiến dịch chưa mở đăng ký',regWhy(c)+' Chỉ chiến dịch đang chạy và trong thời gian hiệu lực mới nhận đăng ký.','warn','warn')):''}
 ${s.k==='pend'?alertB('Đã gửi đăng ký lúc '+dmyhm(r.ts),'Đang chờ quản trị viên duyệt. Sau khi duyệt, link theo dõi xuất hiện ở mục “Chiến dịch đang chạy”. Bạn có thể rút đăng ký trước khi được duyệt.','warn','info'):''}
 ${s.k==='rej'?alertB('Đăng ký bị từ chối lúc '+dmyhm(r.xl),'Lý do: '+r.ly+'. Bạn có thể chỉnh lại và đăng ký lại.','bad','warn'):''}
 ${s.k==='mine'?alertB('Chiến dịch đã được gán cho bạn','Xem link theo dõi, lượt click/view/chuyển đổi và hoa hồng ở mục “Chiến dịch đang chạy”.','ok','check'):''}</div></div>`}
function regBtn(c){const s=regState(c);if(s.k==='pend')return `<button class="btn" data-act="regrw" data-id="${s.r.id}">Rút đăng ký</button>`;if(regOpen(c)&&(s.k==='none'||s.k==='rej'))return `<button class="btn primary" data-act="regnew" data-id="${c.id}">${ic('plus','sm')} ${s.k==='rej'?'Đăng ký lại':'Đăng ký chạy chiến dịch'}</button>`;return''}
function regForm(cid,err){const c=CAMPm[cid],rs=rulesFor(c.id,S.user.pid),ms=CM.filter(x=>x.c===c.id&&x.st===1);DL.rg={c:cid,note:DL.rg&&DL.rg.c===cid?DL.rg.note:''};
 dlg(`<div class="dh"><h2>Đăng ký chạy chiến dịch</h2><p>${c.ten} · ${ysd(c.bd)} → ${c.kt?ysd(c.kt):'không giới hạn'}</p></div><div class="db">
 ${chainL(REG_FLOW,1)}
 <div><h3 style="margin-bottom:6px">Chính sách hoa hồng áp dụng cho bạn</h3>${rs.length?rs.map(r=>`<div class="sm" style="margin-bottom:3px">${bEv(r.ev)} ${ruleText(r)}${r.gx?' · xem ≥ '+r.gx+' giây':''}${r.tl?' · ≥ '+r.tl+'% thời lượng':''}</div>`).join(''):'<span class="mut">Chưa có quy tắc</span>'}</div>
 <div><h3 style="margin-bottom:6px">Nội dung phim sẽ được sinh link (${ms.length})</h3><div class="sm">${ms.map(x=>MOVm[x.m].ten).join(' · ')}</div></div>
 <div class="field"><label for="rg-n">Ghi chú cho quản trị viên</label><textarea id="rg-n" class="textarea" style="height:auto;padding:8px 10px" rows="3" data-dl="rg_note" placeholder="Kênh phân phối dự kiến, đối tượng người xem…">${DL.rg.note}</textarea></div>
 <label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" class="cb" id="rg-ok"> <span>Tôi đã đọc và đồng ý chính sách hoa hồng của chiến dịch này.</span></label>${err?`<span class="emsg">${err}</span>`:''}</div>
 <div class="df"><button class="btn" data-act="ovx">Hủy</button><button class="btn primary" data-act="regdo">Gửi đăng ký</button></div>`,1)}
function regPendHtml(cid){const L=REG.filter(r=>r.c===cid&&r.st===0);if(!L.length)return'';
 return `<div class="card"><div class="ch"><div><h2>Đăng ký chờ duyệt (${L.length})</h2><p>Publisher tự đăng ký chạy chiến dịch. Duyệt để gán chiến dịch và sinh link theo dõi cho từng nội dung phim.</p></div></div>${mini([{t:'Publisher',f:r=>goB('a-pub-d',{id:r.p},PUBm[r.p].ten)},{t:'Gửi lúc',f:r=>dmyhm(r.ts)},{t:'Ghi chú',f:r=>`<span class="cut sm">${r.note||'—'}</span>`},{t:'Trạng thái',f:r=>bReg(r.st)},{t:'',f:r=>`<button class="btn s primary" data-act="regok" data-id="${r.id}">${ic('check','sm')} Duyệt và gán</button> <button class="btn s" data-act="regno" data-id="${r.id}">Từ chối</button>`}],L)}</div>`}
function regHist(cid){const L=REG.filter(r=>r.c===cid&&r.st!==0).sort((a,b)=>b.ts-a.ts);if(!L.length)return'';
 return `<div class="card"><div class="ch"><div><h2>Lịch sử đăng ký</h2></div></div>${mini([{t:'Publisher',f:r=>PUBm[r.p].ten},{t:'Gửi lúc',f:r=>dmyhm(r.ts)},{t:'Trạng thái',f:r=>bReg(r.st)},{t:'Xử lý lúc',f:r=>r.xl?dmyhm(r.xl):'—'},{t:'Lý do / ghi chú',f:r=>`<span class="cut sm">${r.ly||'—'}</span>`}],L)}</div>`}
Object.assign(act,{
 regnew:el=>regForm(Number(el.dataset.id)),
 regdo:()=>{if(!$('#rg-ok').checked){regForm(DL.rg.c,'Cần đồng ý chính sách hoa hồng để gửi đăng ký.');return}
  const c=DL.rg.c,note=($('#rg-n').value||'').trim();REG.push({id:Math.max(0,...REG.map(x=>x.id))+1,p:S.user.pid,c,st:0,ts:NOW,note,ly:null,xl:null,by:null,asg:null});closeOv();toast('Đã gửi đăng ký, chờ quản trị viên duyệt');render()},
 regrw:el=>{const r=REG.find(x=>x.id==el.dataset.id);confirmDlg({title:'Rút đăng ký?',desc:'Đăng ký chạy '+CAMPm[r.c].ten+' sẽ bị hủy. Bạn có thể đăng ký lại sau.',ok:'Rút đăng ký',danger:1,fn:()=>{r.st=3;r.xl=NOW;r.ly='Publisher rút đăng ký';toast('Đã rút đăng ký');render()}})},
 regok:el=>{const r=REG.find(x=>x.id==el.dataset.id),c=CAMPm[r.c],ms=CM.filter(x=>x.c===c.id&&x.st===1);
  confirmDlg({title:'Duyệt và gán '+PUBm[r.p].ten+'?',desc:'Hệ thống tạo bản ghi gán chiến dịch cho publisher và sinh '+ms.length+' link theo dõi, mỗi nội dung phim một link.',ok:'Duyệt và gán',fn:()=>{
   const a={id:Math.max(...ASG.map(x=>x.id))+1,p:r.p,c:c.id,gan:NOW,huy:null,st:1,by:S.user.uid};ASG.push(a);ms.forEach(x=>mkLink(a,x.m));
   r.st=1;r.xl=NOW;r.by=S.user.uid;r.asg=a.id;r.ly='Đã gán chiến dịch';toast('Đã gán chiến dịch và sinh '+ms.length+' link theo dõi');render()}})},
 regno:el=>{DL.rj={id:Number(el.dataset.id),ly:''};regRej()},
 rejdo:()=>{const d=DL.rj,ly=($('#rj-l').value||'').trim();if(!ly){regRej('Nhập lý do từ chối để publisher biết cần chỉnh gì.');return}
  const r=REG.find(x=>x.id===d.id);r.st=2;r.xl=NOW;r.by=S.user.uid;r.ly=ly;closeOv();toast('Đã từ chối đăng ký');render()}});
function regRej(err){const r=REG.find(x=>x.id===DL.rj.id);dlg(`<div class="dh"><h2>Từ chối đăng ký</h2><p>${PUBm[r.p].ten} · ${CAMPm[r.c].ten}</p></div><div class="db"><div class="field"><label for="rj-l">Lý do <i>*</i></label><textarea id="rj-l" class="textarea ${err?'err':''}" style="height:auto;padding:8px 10px" rows="3">${DL.rj.ly}</textarea>${err?`<span class="emsg">${err}</span>`:''}</div></div><div class="df"><button class="btn" data-act="ovx">Hủy</button><button class="btn destructive" data-act="rejdo">Từ chối</button></div>`)}
render();
</script>
</body>
</html>
