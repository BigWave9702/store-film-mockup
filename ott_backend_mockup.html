<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTT Admin – Mockup quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--fg:#18181b;--muted:#f4f4f5;--muted-fg:#71717a;--border:#e4e4e7;--input:#d4d4d8;--card:#fff;
  --primary:#312e81;--primary-fg:#fff;--ring:#6366f1;--accent:#eef2ff;--accent-fg:#312e81;
  --ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;--idle:#52525b;--sidebar:#fafafa;--radius:8px;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#09090b;--fg:#fafafa;--muted:#18181b;--muted-fg:#a1a1aa;--border:#27272a;--input:#3f3f46;--card:#0d0d10;
  --primary:#a5b4fc;--primary-fg:#1e1b4b;--ring:#818cf8;--accent:#1e1b4b;--accent-fg:#c7d2fe;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--idle:#a1a1aa;--sidebar:#0d0d10}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:14px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3,p{margin:0}
.ic{flex:none;vertical-align:-3px}

/* layout */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--sidebar);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center}
.brand b{display:block;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted-fg)}
.grp{margin-top:16px;padding:0 10px 4px;font-size:12px;font-weight:500;color:var(--muted-fg)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-weight:450;color:var(--fg)}
.nav a:hover{background:var(--muted)}
.nav a.on{background:var(--accent);color:var(--accent-fg);font-weight:550}
.nav .tag{margin-left:auto;font-size:11px;color:var(--muted-fg);border:1px dashed var(--input);border-radius:99px;padding:0 6px}
.me{margin-top:auto;border-top:1px solid var(--border);padding:12px 6px 4px;display:flex;gap:10px;align-items:center}
.me .av{width:32px;height:32px}
.me small{display:block;color:var(--muted-fg);font-size:11.5px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:52px;padding:0 24px;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted-fg);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb a:hover{color:var(--fg)}
.sp{flex:1}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--input);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(14px);background:var(--primary-fg)}
.switch input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
#menuBtn{display:none}
#view{padding:24px;max-width:1480px}

/* page head */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ph p{color:var(--muted-fg);margin-top:2px;max-width:70ch}
.ph .sp{flex:1}
.rel{display:none;margin-top:6px;font-size:12px;color:var(--muted-fg)}
.dev .rel{display:block}
.rel code{background:var(--muted);padding:1px 6px;border-radius:4px;margin-right:2px}
.dbn{display:none;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--ring);margin-top:1px}
.dev .dbn{display:block}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;background:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:focus-visible,.input:focus-visible,.ms-trigger:focus-visible,.tab:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.outline{background:var(--bg);border-color:var(--input)}
.btn.outline:hover,.btn.ghost:hover{background:var(--muted)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.destructive{background:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.input,textarea.input{width:100%;height:36px;border:1px solid var(--input);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
textarea.input{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.input[disabled],.input[readonly]{background:var(--muted);color:var(--muted-fg)}
.input::placeholder{color:var(--muted-fg)}
.inwrap{position:relative}
.inwrap .ic{position:absolute;left:10px;top:11px;color:var(--muted-fg)}
.inwrap .input{padding-left:32px}
.fld>label,.field>label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.fld>label small,.field>label small{font-weight:400;color:var(--muted-fg)}
.hint{font-size:12px;color:var(--muted-fg);margin-top:4px}
.field .hint code{background:var(--muted);padding:0 4px;border-radius:3px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:color-mix(in oklab,var(--c,var(--idle)) 13%,transparent);color:var(--c,var(--idle))}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.ok{--c:var(--ok)}.badge.warn{--c:var(--warn)}.badge.bad{--c:var(--bad)}.badge.info{--c:var(--info)}.badge.idle{--c:var(--idle)}.badge.pri{--c:var(--accent-fg);background:var(--accent)}
.badge.mono{font-family:var(--mono);font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg)}
.chip i{font-style:normal;color:var(--muted-fg);font-family:var(--mono);font-size:11px}
.lnk{color:var(--accent-fg);font-weight:500}
.lnk:hover{text-decoration:underline}
.mut{color:var(--muted-fg)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.kid{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.cardh{padding:16px 20px 0}
.cardh h2{font-size:15px;font-weight:600}
.cardh p{color:var(--muted-fg);font-size:13px;margin-top:2px}
.cardb{padding:16px 20px 20px}
.fbar{padding:16px 20px;margin-bottom:16px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.frow+.frow{margin-top:12px}
.frow .fld{min-width:190px;flex:0 1 220px}
.frow .fld.grow{flex:1 1 320px}
.frow .fld.date{flex:0 0 330px}
.drange{display:flex;align-items:center;gap:6px}
.drange input{width:150px;flex:1;min-width:0}
.fact{display:flex;gap:8px;margin-left:auto}
.presets{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--muted-fg)}
.presets button{height:26px;padding:0 10px;border:1px solid var(--border);border-radius:99px;background:var(--bg);cursor:pointer;font-size:12.5px}
.presets button:hover{background:var(--muted)}
.ferr{margin-top:10px;color:var(--bad);font-size:13px;display:flex;gap:6px;align-items:center}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted-fg);font-size:12.5px}
.kpi b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted-fg)}
.kpi .sub span b{display:inline;font-size:12.5px;font-weight:600;color:var(--fg)}

/* table */
.tw{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{height:40px;padding:0 12px;text-align:left;font-weight:500;color:var(--muted-fg);white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle;background:color-mix(in oklab,var(--muted) 55%,var(--card))}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:color-mix(in oklab,var(--muted) 60%,transparent)}
.tbl td:last-child:has(>.btn),.tbl th:last-child:empty{position:sticky;right:0;background:var(--card);box-shadow:-8px 0 8px -8px rgba(0,0,0,.12)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nw{white-space:nowrap}
.tbl .nkc{min-width:230px}
.cell2 b{display:block;font-weight:500}
.cell2 span{display:block;color:var(--muted-fg);font-size:12.5px}
.resh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted-fg)}
.resh b{color:var(--fg);font-weight:600}
.pg{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted-fg)}
.empty{padding:48px 20px;text-align:center;color:var(--muted-fg)}
.empty b{display:block;color:var(--fg);font-weight:600;margin:6px 0 2px}
.empty.sm{padding:28px 20px}
.tbar{display:flex;gap:6px;justify-content:flex-end}
.prog{height:6px;border-radius:99px;background:var(--muted);min-width:90px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary)}

/* tabs */
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--muted);border-radius:8px;margin-bottom:16px;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--muted-fg);cursor:pointer;white-space:nowrap;text-align:left}
.tab small.n{margin-left:6px;font-size:11.5px;background:var(--bg);border-radius:99px;padding:0 6px;color:var(--muted-fg)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab.on small.n{background:var(--accent);color:var(--accent-fg)}

/* alerts */
.alert{display:flex;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;align-items:flex-start;background:var(--card)}
.alert .ic{margin-top:2px;color:var(--info)}
.alert.warn{border-color:color-mix(in oklab,var(--warn) 45%,var(--border))}.alert.warn .ic{color:var(--warn)}
.alert.bad{border-color:color-mix(in oklab,var(--bad) 45%,var(--border))}.alert.bad .ic{color:var(--bad)}
.alert b{font-weight:600}

/* user header */
.uh{display:flex;gap:18px;padding:20px;flex-wrap:wrap}
.uh .av{width:56px;height:56px;font-size:19px}
.uh h1{font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.uinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 24px;margin-top:14px;flex:1 1 520px}
.uinfo small{display:block;color:var(--muted-fg);font-size:12px}
.uinfo div>span{font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{padding:14px;display:flex;gap:12px}
.pcard.slot{border-style:dashed;align-items:center;justify-content:center;color:var(--muted-fg);min-height:110px;background:transparent}
.pcard h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard dl{margin:8px 0 0;display:grid;grid-template-columns:120px 1fr;gap:3px 12px;font-size:12.5px}
.pcard dt{color:var(--muted-fg)}.pcard dd{margin:0}

/* form cards */
.tabhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tabhead p{color:var(--muted-fg);font-size:13px;flex:1 1 320px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));align-items:start}
.fgrid.s{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:12px}
.fcard>header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.fcard>header .ttl{font-weight:600;flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fcard .fbody{padding:16px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fcard .fbody .full{grid-column:1/-1}
.fcard .fbody>*{min-width:0}
.fcard .fbody .input{min-width:0}
.fcard>footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--border);background:color-mix(in oklab,var(--muted) 45%,transparent);border-radius:0 0 12px 12px}
.fcard>footer .l{margin-right:auto;font-size:12px;color:var(--muted-fg);align-self:center;font-family:var(--mono)}
.fmain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px}
.fmain .full{grid-column:1/-1}
.sfx{position:relative}
.sfx .input{padding-right:48px}
.sfx em{position:absolute;right:10px;top:8px;font-style:normal;color:var(--muted-fg);font-size:12.5px}
.calc{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px dashed var(--input);border-radius:6px;font-weight:600;background:var(--accent);color:var(--accent-fg)}
.calc small{display:none}
.tgl{display:flex;align-items:center;gap:8px;height:36px}

/* multiselect (select2-like) */
.ms{position:relative}
.ms-trigger{width:100%;height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border:1px solid var(--input);border-radius:6px;background:var(--bg);cursor:pointer;text-align:left}
.ms-trigger[disabled]{background:var(--muted);color:var(--muted-fg);cursor:not-allowed}
.ms-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-label.ph{color:var(--muted-fg)}
.ms-label .cnt{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:11.5px;padding:0 7px;margin-left:6px;font-weight:600}
.ms-pop{position:absolute;z-index:40;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px -8px rgba(0,0,0,.25);padding:6px}
.ms-sw{position:relative}
.ms-sw .ic{position:absolute;left:9px;top:10px;color:var(--muted-fg)}
.ms-search{width:100%;height:34px;border:0;border-bottom:1px solid var(--border);padding:0 8px 0 30px;background:transparent;color:var(--fg);font:inherit;outline:0}
.ms-tools{display:flex;gap:4px;padding:6px 2px;border-bottom:1px solid var(--border)}
.ms-tools button{border:0;background:transparent;color:var(--accent-fg);font-size:12.5px;font-weight:500;padding:3px 8px;border-radius:4px;cursor:pointer}
.ms-tools button:hover{background:var(--accent)}
.ms-list{max-height:220px;overflow:auto;padding-top:4px}
.ms-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;cursor:pointer;border:0;background:transparent;text-align:left}
.ms-item:hover{background:var(--muted)}
.ms-item input{accent-color:var(--primary);margin:0}
.ms-item.on{font-weight:550}
.ms-item .ic{margin-left:auto;color:var(--primary)}
.ms-none{padding:10px;color:var(--muted-fg);font-size:13px}

/* dialog / toast */
.ov{position:fixed;inset:0;background:rgba(9,9,11,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .12s}
.dlg{width:min(480px,100%);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 20px 50px -10px rgba(0,0,0,.4)}
.dlg h3{font-size:16px;font-weight:600}
.dlg .d{color:var(--muted-fg);margin-top:4px}
.dlg .b{margin-top:14px;display:grid;gap:12px}
.dlg .f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;padding:10px 12px;background:var(--muted);border-radius:8px}
.kv dt{color:var(--muted-fg)}.kv dd{margin:0;word-break:break-all}
#toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:grid;gap:8px}
.toast{display:flex;gap:10px;align-items:flex-start;max-width:380px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.3);animation:fade .15s}
.toast.ok .ic{color:var(--ok)}.toast.bad .ic{color:var(--bad)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:60;left:0;top:0;width:264px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  #menuBtn{display:inline-flex}
  #view{padding:16px}.top{padding:0 16px}
  .fmain{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .fmain,.fcard .fbody{grid-template-columns:1fr}
  .fgrid,.fgrid.s{grid-template-columns:1fr}
  .drange input{width:130px}
  .fact{margin-left:0;width:100%}
  .frow .fld{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost sm" id="menuBtn" data-act="menu" aria-label="Mở menu"></button>
      <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
      <div class="sp"></div>
      <label class="switch" title="Hiện tên bảng/cột dưới mỗi tiêu đề để đối chiếu với ott_db"><input type="checkbox" id="devToggle"><span>Đối chiếu DB</span></label>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="dlg"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ============ DỮ LIỆU MẪU (mô phỏng ott_db) ============ */
const TODAY='2026-10-08';
const pad=n=>String(n).padStart(2,'0');
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const addMonths=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCMonth(t.getUTCMonth()+n);return t.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const addHours=(s,h)=>{const t=new Date(s.slice(0,10)+'T'+s.slice(11,16)+':00Z');t.setUTCHours(t.getUTCHours()+h);return t.toISOString().slice(0,10)+' '+t.toISOString().slice(11,16)};

/* ----- multi/single select kiểu select2: tìm kiếm, chọn tất cả, bỏ chọn tất cả ----- */
const MS={};
function msLabel(id){const m=MS[id],n=m.opts.length;
 if(m.multi){if(!m.sel.size)return `<span class="ms-label ph">${m.ph}</span>`;
  if(m.sel.size===n&&n>1)return `<span class="ms-label">Tất cả<span class="cnt">${n}</span></span>`;
  const names=m.opts.filter(o=>m.sel.has(o.v)).map(o=>o.l);
  return names.length<=2?`<span class="ms-label">${esc(names.join(', '))}</span>`:`<span class="ms-label">${esc(names[0])}<span class="cnt">+${names.length-1}</span></span>`}
 const o=m.opts.find(o=>m.sel.has(o.v));return o?`<span class="ms-label">${esc(o.l)}</span>`:`<span class="ms-label ph">${m.ph}</span>`}
function msItems(id){const m=MS[id];
 return m.opts.map(o=>m.multi?`<label class="ms-item" data-t="${esc(un(o.l))}"><input type="checkbox" value="${esc(o.v)}" ${m.sel.has(o.v)?'checked':''}><span>${esc(o.l)}</span></label>`
 :`<button type="button" class="ms-item ${m.sel.has(o.v)?'on':''}" data-act="ms-pick" data-v="${esc(o.v)}" data-t="${esc(un(o.l))}"><span>${esc(o.l)}</span>${m.sel.has(o.v)?icon('check',14):''}</button>`).join('')+`<div class="ms-none" hidden>Không tìm thấy</div>`}
function ms(id,opts,sel,o={}){MS[id]={opts,sel:new Set([...(sel||[])].map(String)),multi:o.multi!==false,ph:o.ph||(o.multi===false?'Chọn…':'Tất cả'),cb:o.cb};
 return `<div class="ms" data-ms="${id}"><button type="button" class="ms-trigger" data-act="ms-open" ${o.dis?'disabled':''} aria-haspopup="listbox">${msLabel(id)}${icon('chevD',14)}</button><div class="ms-pop" hidden><div class="ms-sw">${icon('search',14)}<input class="ms-search" placeholder="Tìm kiếm…" aria-label="Tìm trong danh sách"></div>${MS[id].multi?'<div class="ms-tools"><button type="button" data-act="ms-all">Chọn tất cả</button><button type="button" data-act="ms-none">Bỏ chọn tất cả</button></div>':''}<div class="ms-list">${msItems(id)}</div></div></div>`}
function msRefresh(root){const id=root.dataset.ms,m=MS[id];$('.ms-trigger',root).innerHTML=msLabel(id)+icon('chevD',14);$('.ms-list',root).innerHTML=msItems(id);if(m.cb)m.cb(m.sel)}
function closeMs(except){$$('.ms-pop').forEach(p=>{if(!except||p.parentNode!==except)p.hidden=true})}

/* ----- bộ lọc + danh sách (tìm kiếm mặc định = hôm nay, tối đa 30 ngày) ----- */
const F={},P={},LISTS={},PER=10;
const dfl=()=>({q:'',from:TODAY,to:TODAY,ms:{}});
const getF=k=>F[k]||(F[k]=dfl());
function listPage(cfg){LISTS[cfg.key]=cfg;const f=getF(cfg.key);P[cfg.key]=1;
 const dateBox=cfg.date?`<div class="fld date"><label>${cfg.dateLabel} <small>(tối đa 30 ngày)</small></label><div class="drange"><input class="input" type="date" id="f-from" value="${f.from}" max="${TODAY}" aria-label="Từ ngày"><span class="mut">–</span><input class="input" type="date" id="f-to" value="${f.to}" max="${TODAY}" aria-label="Đến ngày"></div></div>`:'';
 $('#view').innerHTML=`<div class="ph"><div><h1>${cfg.title}</h1><p>${cfg.desc}</p>${rel(cfg.tables)}</div><div class="sp"></div>${cfg.headAct||''}</div>
 <form class="card fbar" data-key="${cfg.key}" onsubmit="return false">
  <div class="frow"><div class="fld grow"><label for="f-q">Tìm kiếm</label><div class="inwrap">${icon('search',15)}<input class="input" id="f-q" placeholder="${esc(cfg.ph)}" value="${esc(f.q)}"></div></div>${dateBox}</div>
  ${(cfg.filters||[]).length?`<div class="frow">${cfg.filters.map(fl=>`<div class="fld"><label>${fl.label}</label>${ms(cfg.key+'.'+fl.key,fl.opts,f.ms[fl.key],{multi:true})}</div>`).join('')}<div class="fact"><button class="btn outline" data-act="reset" data-k="${cfg.key}">Đặt lại</button><button class="btn primary" data-act="search" data-k="${cfg.key}">${icon('search',15)} Tìm kiếm</button></div></div>`:`<div class="frow"><div class="fact"><button class="btn outline" data-act="reset" data-k="${cfg.key}">Đặt lại</button><button class="btn primary" data-act="search" data-k="${cfg.key}">${icon('search',15)} Tìm kiếm</button></div></div>`}
  ${cfg.date?`<div class="presets">Chọn nhanh: <button type="button" data-act="preset" data-d="0">Hôm nay</button><button type="button" data-act="preset" data-d="6">7 ngày</button><button type="button" data-act="preset" data-d="29">30 ngày</button></div>`:''}
  <p class="ferr" id="ferr" hidden></p></form><div id="res"></div>`;
 drawRes(cfg.key)}
function filtered(cfg){const f=getF(cfg.key),qn=un(f.q.trim());
 let rows=cfg.rows().filter(r=>{
  if(cfg.date){const d=(cfg.date(r)||'').slice(0,10);if(d<f.from||d>f.to)return false}
  if(qn&&!un(cfg.search(r)).includes(qn))return false;
  for(const fl of cfg.filters||[]){const s=f.ms[fl.key];if(s&&s.size){const v=fl.get(r),vs=Array.isArray(v)?v:[v];if(!vs.some(x=>s.has(String(x))))return false}}
  return true});
 return cfg.date?rows.sort((a,b)=>cfg.date(b).localeCompare(cfg.date(a))):rows}
function drawRes(k){const cfg=LISTS[k],rows=filtered(cfg),f=getF(k),pages=Math.max(1,Math.ceil(rows.length/PER));
 if(P[k]>pages)P[k]=pages;const slice=rows.slice((P[k]-1)*PER,P[k]*PER);
 const range=cfg.date?(f.from===f.to?(f.from===TODAY?'Hôm nay ('+fmtD(f.from)+')':fmtD(f.from)):fmtD(f.from)+' – '+fmtD(f.to)):'';
 $('#res').innerHTML=(cfg.kpis?`<div class="kpis">${cfg.kpis(rows).map(x=>`<div class="card kpi"><small>${x.l}</small><b>${x.v}</b>${x.sub?`<div class="sub">${x.sub}</div>`:''}</div>`).join('')}</div>`:'')+
 `<div class="card"><div class="resh"><span><b>${num(rows.length)}</b> kết quả${range?' · '+range:''}</span></div>${rows.length?tbl(cfg.cols,slice):`<div class="empty">${icon('search',26)}<b>Không có dữ liệu trong khoảng này</b>${cfg.date?'Thử chọn khoảng ngày rộng hơn (tối đa 30 ngày) hoặc đặt lại bộ lọc.':'Thử đặt lại bộ lọc.'}</div>`}
 ${rows.length>PER?`<div class="pg"><span>Hiển thị ${(P[k]-1)*PER+1}–${Math.min(P[k]*PER,rows.length)} / ${rows.length}</span><span class="sp" style="flex:1"></span><button class="btn outline sm" data-act="page" data-k="${k}" data-d="-1" ${P[k]<=1?'disabled':''}>${icon('chevL',14)} Trước</button><span>Trang ${P[k]}/${pages}</span><button class="btn outline sm" data-act="page" data-k="${k}" data-d="1" ${P[k]>=pages?'disabled':''}>Sau ${icon('chevR',14)}</button></div>`:''}</div>`}
function doSearch(k){const cfg=LISTS[k],f=getF(k),err=$('#ferr');
 const q=$('#f-q').value;let from=f.from,to=f.to;
 if(cfg.date){from=$('#f-from').value;to=$('#f-to').value;
  const bad=!from||!to?'Hãy chọn đủ ngày bắt đầu và ngày kết thúc.':from>to?'Ngày bắt đầu phải trước hoặc bằng ngày kết thúc.':dayDiff(from,to)>29?`Khoảng thời gian tối đa 30 ngày. Bạn đang chọn ${dayDiff(from,to)+1} ngày.`:'';
  if(bad){err.hidden=false;err.innerHTML=icon('alert',15)+bad;return}}
 err.hidden=true;f.q=q;f.from=from;f.to=to;
 (cfg.filters||[]).forEach(fl=>{f.ms[fl.key]=new Set(MS[k+'.'+fl.key].sel)});
 P[k]=1;drawRes(k)}

 ph:'Email, họ tên, số điện thoại hoặc ID người dùng',date:r=>r.ngay_tao,dateLabel:'Ngày tạo tài khoản',
 rows:()=>USERS,search:r=>`${r.email} ${r.ho_ten} ${r.sdt} ${r.id}`,

 ph:'Email, tên nội dung hoặc mã phiên',date:r=>r.bd,dateLabel:'Bắt đầu phát',rows:()=>PLAY,search:r=>`${UM[r.uid].email} ${UM[r.uid].ho_ten} ${r.title} ${r.uuid}`,
 filters:[{key:'tt',label:'Trạng thái',opts:Object.entries(ST.play).map(([v,x])=>({v,l:x[1]})),get:r=>r.tt},{key:'dt',label:'Loại thiết bị',opts:optDT(),get:r=>DM[r.dev].loai},{key:'plan',label:'Gói của người dùng',opts:optPlan(),get:r=>UM[r.uid]._plan}],
 kpis:rows=>[{l:'Phiên phát',v:num(rows.length),sub:kpiSub([['Đang phát',rows.filter(r=>r.tt===1).length],['Hết hạn',rows.filter(r=>r.tt===3).length],['Đã thu hồi',rows.filter(r=>r.tt===4).length]])}],
 cols:[{h:'Mã phiên',c:'ma_phien',r:p=>`<span class="mono">${p.uuid.slice(0,8)}…</span>`},{h:'Người dùng',c:'ma_nguoi_dung',r:p=>ucell(p.uid)},{h:'Nội dung',c:'ma_noi_dung',r:p=>`<div class="cell2"><b>${esc(p.title)}</b><span>nội dung #${p.nd}</span></div>`},
  {h:'Thiết bị',c:'ma_thiet_bi',r:p=>{const d=DM[p.dev];return `<div class="cell2"><b>${esc(d.ten)}</b><span>${d.loai}</span></div>`}},{h:'Bắt đầu',c:'bat_dau_luc',r:p=>fmtDT(p.bd),cls:'nw'},{h:'Token hết hạn',c:'het_han_luc',r:p=>fmtDT(p.het),cls:'nw'},
  {h:'Trạng thái',c:'trang_thai',r:p=>sb('play',p.tt)},{h:'Thu hồi bởi',c:'nhat_ky_thu_hoi',r:p=>nkCell(1,p.id),cls:'nkc'},{h:'',r:p=>p.tt===1?`<button class="btn outline sm danger" data-act="revoke-play" data-id="${p.id}">${icon('ban',14)} Thu hồi</button>`:'',cls:'nw'}]})}
function revokePlay(id){const p=PLAY.find(x=>x.id===id),u=UM[p.uid];
 dialog({title:'Thu hồi phiên phát?',desc:'Người dùng sẽ bị dừng phát ở lần xin manifest tiếp theo.',ok:'Thu hồi phiên',danger:true,
 body:`<dl class="kv"><dt>Người dùng</dt><dd>${esc(u.email)}</dd><dt>Nội dung</dt><dd>${esc(p.title)}</dd><dt>Thiết bị</dt><dd>${esc(DM[p.dev].ten)}</dd><dt>Mã phiên</dt><dd class="mono">${p.uuid}</dd></dl>${alertBox('info','','Play token bị từ chối ở Cloudflare và bộ đếm phiên đồng thời trên Redis giảm 1, nên người dùng có thể phát trên thiết bị khác ngay.')}<div class="field"><label>Lý do thu hồi <small>bắt buộc · ly_do</small></label><input class="input" id="rv-note" maxlength="500" placeholder="Ví dụ: Nghi ngờ chia sẻ tài khoản"></div>`,
 onOk:()=>{const ly=$('#rv-note').value.trim();if(!ly){toast('Nhập lý do thu hồi.','bad');return false}p.tt=4;NK.push({id:_nk++,loai:1,dt:p.id,uid:p.uid,pv:0,nguoi:ADMIN,ly_do:ly,tg:NOW});toast('Đã thu hồi phiên phát và ghi nhật ký');drawRes('play')}})}
function loginsPage(){curNavSet('logins');setCrumb(['Quản lý hệ thống','Quản lý phiên đăng nhập']);
 listPage({key:'logins',title:'Quản lý phiên đăng nhập',desc:'Phiên đăng nhập theo thiết bị. Thu hồi khiến thiết bị phải đăng nhập lại; không xóa được lịch sử.',tables:['phien_dang_nhap → nguoi_dung','phien_dang_nhap → ho_so','phien_dang_nhap → thiet_bi','nhat_ky_thu_hoi'],
 ph:'Email, IP, user agent hoặc family ID',date:r=>r.login,dateLabel:'Thời gian đăng nhập',rows:()=>LOGIN,search:r=>`${UM[r.uid].email} ${UM[r.uid].ho_ten} ${r.ip} ${r.ua} ${r.fam}`,
 filters:[{key:'tt',label:'Trạng thái',opts:Object.entries(ST.login).map(([v,x])=>({v,l:x[1]})),get:r=>r.tt},{key:'dt',label:'Loại thiết bị',opts:optDT(),get:r=>DM[r.dev].loai},{key:'vung',label:'Vùng người dùng',opts:optV(),get:r=>UM[r.uid].vung}],
 kpis:rows=>[{l:'Phiên đăng nhập',v:num(rows.length),sub:kpiSub([['Đang sử dụng',rows.filter(r=>r.tt===1).length],['Đã thu hồi',rows.filter(r=>r.tt===2).length]])}],
 cols:[{h:'Người dùng',c:'ma_nguoi_dung',r:l=>ucell(l.uid)},{h:'Hồ sơ',c:'ma_ho_so',r:l=>esc(PM[l.hs].ten)},{h:'Thiết bị',c:'ma_thiet_bi',r:l=>{const d=DM[l.dev];return `<div class="cell2"><b>${esc(d.ten)}</b><span>${d.loai}</span></div>`}},{h:'IP',c:'ip_dang_nhap',r:l=>`<span class="mono">${l.ip}</span>`},
  {h:'Đăng nhập',c:'thoi_gian_dang_nhap',r:l=>fmtDT(l.login),cls:'nw'},{h:'Hết hạn',c:'thoi_gian_het_han',r:l=>fmtD(l.het),cls:'nw'},{h:'Đăng xuất',c:'thoi_gian_dang_xuat',r:l=>fmtDT(l.logout),cls:'nw'},
  {h:'Family ID',c:'family_id',r:l=>`<span class="mono mut">${l.fam}</span>`},{h:'Trạng thái',c:'trang_thai',r:l=>sb('login',l.tt)},{h:'Thu hồi bởi',c:'nhat_ky_thu_hoi',r:l=>nkCell(2,l.id),cls:'nkc'},{h:'',r:l=>l.tt===1?`<button class="btn outline sm danger" data-act="revoke-login" data-id="${l.id}">${icon('ban',14)} Thu hồi</button>`:'',cls:'nw'}]})}
function revokeLogin(id){const l=LOGIN.find(x=>x.id===id),u=UM[l.uid],n=LOGIN.filter(x=>x.fam===l.fam&&x.tt===1).length;
 dialog({title:'Thu hồi phiên đăng nhập?',desc:'Thiết bị sẽ bị đăng xuất và phải đăng nhập lại.',ok:'Thu hồi phiên',danger:true,
 body:`<dl class="kv"><dt>Người dùng</dt><dd>${esc(u.email)}</dd><dt>Thiết bị</dt><dd>${esc(DM[l.dev].ten)}</dd><dt>IP</dt><dd class="mono">${l.ip}</dd><dt>Family ID</dt><dd class="mono">${l.fam}</dd></dl>${alertBox('info','','Refresh token của phiên này không còn dùng được.')}<div class="field"><label>Lý do thu hồi <small>bắt buộc · ly_do</small></label><input class="input" id="rv-note" maxlength="500" placeholder="Ví dụ: Thiết bị bị báo mất"></div><label class="tgl switch"><input type="checkbox" id="rv-fam" ${n>1?'':'disabled'}><span>Thu hồi mọi phiên cùng thiết bị (family ID) · ${n} phiên đang dùng</span></label>`,
 onOk:()=>{const ly=$('#rv-note').value.trim();if(!ly){toast('Nhập lý do thu hồi.','bad');return false}const fam=$('#rv-fam')?.checked;LOGIN.forEach(x=>{if(x.id===id||(fam&&x.fam===l.fam&&x.tt===1)){x.tt=2;x.logout=NOW;NK.push({id:_nk++,loai:2,dt:x.id,uid:x.uid,pv:fam?1:0,nguoi:ADMIN,ly_do:ly,tg:NOW})}});toast('Đã thu hồi phiên đăng nhập và ghi nhật ký');drawRes('logins')}})}
/* ============ ĐỒNG BỘ DỮ LIỆU CẤU HÌNH ============ */
const repl=(arr,fn,items)=>{for(let i=arr.length-1;i>=0;i--)if(fn(arr[i]))arr.splice(i,1);arr.push(...items)};
function syncCards(){const pid=PS.p.id;
 if(PS.kind==='plan'){
  GOI_DN=GOI_DN.filter(x=>x.goi!==pid).concat(PS.lang.filter(c=>c._saved).map(c=>({id:c.id,goi:pid,nn:+c.nn,ten:c.ten,mo:c.mo,ghichu:c.ghichu,tt:c.tt})));
  repl(GIA,x=>x.goi===pid,PS.price.filter(c=>c._saved).map(c=>({id:c.id,goi:pid,vung:+c.vung,th:+c.th,moi:+c.moi,goc:+c.goc,pct:+c.pct,ban:c.ban,bd:c.bd,kt:c.kt||null,tt:c.tt})));
  repl(TN_GOI,x=>x.goi===pid,PS.feat.filter(c=>c._saved).map(c=>({id:c.id,goi:pid,tn:+c.tn,gt:c.gt})));
 }else{
  repl(TN_DN,x=>x.tn===pid,PS.fl.filter(c=>c._saved).map(c=>({id:c.id,tn:pid,nn:+c.nn,ten:c.ten,mo:c.mo})));
 }}
const NEW={lang:()=>({nn:'',ten:'',mo:'',ghichu:'',tt:1}),price:()=>({vung:1,th:1,moi:0,goc:0,pct:0,ban:0,bd:TODAY,kt:'',tt:1}),feat:()=>({tn:'',gt:''}),fl:()=>({nn:'',ten:'',mo:''})};
const NAMES={lang:'cấu hình ngôn ngữ',price:'mức giá',feat:'tính năng của gói',fl:'cấu hình ngôn ngữ'};
function validateCard(g,c){
 if((g==='lang'||g==='fl')&&(!c.nn||!String(c.ten).trim()))return 'Chọn ngôn ngữ và nhập tên hiển thị.';
 if(g==='price'){if(!(+c.th>0))return 'Kỳ hạn phải lớn hơn 0.';if(!c.bd)return 'Chọn ngày bắt đầu hiệu lực.';if(c.kt&&c.kt<c.bd)return 'Ngày kết thúc phải sau ngày bắt đầu.';if(overlapOf(c))return 'Mức giá trùng hiệu lực với mức giá khác.'}
 if(g==='feat'&&(!c.tn||!String(c.gt).trim()))return 'Chọn tính năng và nhập giá trị.';
 return ''}

/* ============ SỰ KIỆN ============ */
function filterMs(root,q){const qn=un(q);let any=false;$$('.ms-item',root).forEach(i=>{const ok=i.dataset.t.includes(qn);i.hidden=!ok;if(ok)any=true});$('.ms-none',root).hidden=any}
document.addEventListener('click',e=>{
 if(!e.target.closest('.ms'))closeMs();
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='dlg-bg'){if(e.target===a)closeDlg();return}
 switch(act){
  case 'menu':$('#side').classList.toggle('open');break;
  case 'ms-open':{const root=a.closest('.ms'),pop=$('.ms-pop',root),was=!pop.hidden;closeMs(root);pop.hidden=was;if(!pop.hidden){const s=$('.ms-search',root);s.value='';filterMs(root,'');s.focus()}break}
  case 'ms-all':{const root=a.closest('.ms'),m=MS[root.dataset.ms];m.sel=new Set(m.opts.map(o=>o.v));msRefresh(root);break}
  case 'ms-none':{const root=a.closest('.ms');MS[root.dataset.ms].sel=new Set();msRefresh(root);break}
  case 'ms-pick':{const root=a.closest('.ms');MS[root.dataset.ms].sel=new Set([a.dataset.v]);msRefresh(root);$('.ms-pop',root).hidden=true;break}
  case 'search':doSearch(a.dataset.k);break;
  case 'reset':F[a.dataset.k]=dfl();route();break;
  case 'preset':{$('#f-from').value=addDays(TODAY,-a.dataset.d);$('#f-to').value=TODAY;$('#ferr').hidden=true;break}
  case 'page':{const k=a.dataset.k;P[k]+=+a.dataset.d;drawRes(k);break}
  case 'tab':{const g=a.dataset.g;if(g==='ut'){UTAB=a.dataset.k;drawUTabs(UM[+location.hash.split('/').pop()])}else{PS.tab=a.dataset.k;drawPTabs()}break}
  case 'revoke-play':revokePlay(+a.dataset.id);break;
  case 'revoke-login':revokeLogin(+a.dataset.id);break;
  case 'zone-edit':zoneDialog(+a.dataset.id);break;
  case 'dlg-close':closeDlg();break;
  case 'dlg-ok':{if(DLG_OK){const r=DLG_OK();if(r===false)return}closeDlg();break}
  case 'month':{const s=PS.sub;s.month=addMonths(s.month+'-01',+a.dataset.d).slice(0,7);if(s.month>TODAY.slice(0,7))s.month=TODAY.slice(0,7);drawSubsTab();break}
  case 'add-card':{if(PS.isNew)return;const g=a.dataset.g,k='n'+(++KN);PS[g].push({_k:k,_saved:false,_dirty:true,...NEW[g]()});drawPTabs();const s=secOf(g,k);if(s){s.scrollIntoView({block:'center',behavior:'smooth'});$('input,textarea',s)?.focus({preventScroll:true})}break}
  case 'save-card':{const sec=a.closest('.fcard'),g=sec.dataset.g,c=PS[g].find(x=>x._k===sec.dataset.k),err=validateCard(g,c);
   if(err){toast(err,'bad');return}
   if(!c.id)c.id=g==='lang'?++_gdn:g==='price'?_gia++:g==='feat'?_tg++:_tdn++;
   if(g==='price')c.ban=calcBan(c);
   c._saved=true;c._dirty=false;syncCards();drawPTabs();toast('Đã lưu '+NAMES[g]);break}
  case 'del-card':{const sec=a.closest('.fcard'),g=sec.dataset.g,c=PS[g].find(x=>x._k===sec.dataset.k);
   const rm=()=>{PS[g]=PS[g].filter(x=>x!==c);syncCards();drawPTabs();toast('Đã xóa '+NAMES[g])};
   if(!c._saved){rm();return}
   dialog({title:'Xóa '+NAMES[g]+'?',desc:g==='price'?'Mức giá bị xóa mềm. Các đăng ký đã mua vẫn giữ nguyên giá đã chốt (BR-03).':'Cấu hình bị xóa mềm (da_xoa = true) và không còn hiển thị cho người dùng.',ok:'Xóa',danger:true,onOk:rm});break}
  case 'save-main':{const p=PS.p;
   if(PS.kind==='plan'){const ma=p.ma.trim().toUpperCase();
    if(!/^[A-Z][A-Z0-9_]{1,49}$/.test(ma)){toast('Mã gói gồm chữ in hoa, số và dấu gạch dưới (ví dụ VIP_PLUS).','bad');return}
    if(!(+p.tb>=1)){toast('Số thiết bị đồng thời phải từ 1 trở lên.','bad');return}
    if(PS.isNew){if(PLAN.some(x=>x.ma===ma)){toast('Mã gói đã tồn tại.','bad');return}
     const np={id:Math.max(...PLAN.map(x=>x.id))+1,ma,tb:+p.tb,tt:p.tt,ten:p.ten,mo:p.mo};PLAN.push(np);PLm[np.id]=np;toast('Đã tạo gói '+ma);location.hash='#/plans/'+np.id;return}
    Object.assign(PLm[p.id],{tb:+p.tb,tt:p.tt,ten:p.ten,mo:p.mo});toast('Đã lưu thông tin chung của gói');
   }else{const ma=p.ma.trim().toUpperCase();
    if(!/^[A-Z][A-Z0-9_]{1,49}$/.test(ma)){toast('Mã tính năng gồm chữ in hoa, số và dấu gạch dưới.','bad');return}
    if(PS.isNew){if(TN.some(x=>x.ma===ma)){toast('Mã tính năng đã tồn tại.','bad');return}
     const nt={id:Math.max(...TN.map(x=>x.id))+1,ma,mac:p.mac,tt:p.tt};TN.push(nt);TNm[nt.id]=nt;toast('Đã tạo tính năng '+ma);location.hash='#/features/'+nt.id;return}
    Object.assign(TNm[p.id],{mac:p.mac,tt:p.tt});toast('Đã lưu thông tin chung của tính năng')}
   break}
 }});
document.addEventListener('change',e=>{
 const cb=e.target.closest('.ms-item input');if(cb){const root=cb.closest('.ms'),m=MS[root.dataset.ms];cb.checked?m.sel.add(cb.value):m.sel.delete(cb.value);$('.ms-trigger',root).innerHTML=msLabel(root.dataset.ms)+icon('chevD',14);if(m.cb)m.cb(m.sel);return}
 if(e.target.id==='smonth'){PS.sub.month=e.target.value||TODAY.slice(0,7);drawSubsTab()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.classList.contains('ms-search')){filterMs(t.closest('.ms'),t.value);return}
 if(t.id==='sq'){PS.sub.q=t.value;drawSubRes();return}
 if(t.dataset.main){PS.p[t.dataset.main]=t.type==='number'?+t.value:t.value;return}
 if(t.dataset.f){const sec=t.closest('.fcard');if(!sec)return;const g=sec.dataset.g,c=PS[g].find(x=>x._k===sec.dataset.k);
  c[t.dataset.f]=t.type==='checkbox'?(t.checked?1:0):t.dataset.t==='n'?(t.value===''?'':+t.value):t.value;markDirty(c);if(HOOK[g])HOOK[g](c,sec,t.dataset.f)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeMs();if(DLG_OK)closeDlg()}
 if(e.key==='Enter'&&e.target.id==='f-q'){e.preventDefault();doSearch(e.target.closest('form').dataset.key)}});

/* ============ ROUTER ============ */
const ROUTES=[[/^\/users$/,usersPage],[/^\/users\/(\d+)$/,id=>userPage(+id)],[/^\/profiles$/,profilesPage],[/^\/devices$/,devicesPage],[/^\/subs$/,subsPage],[/^\/payments$/,paymentsPage],[/^\/plans$/,plansPage],[/^\/plans\/(\w+)$/,planPage],[/^\/features$/,featuresPage],[/^\/features\/(\w+)$/,featurePage],[/^\/zones$/,zonesPage],[/^\/play$/,playPage],[/^\/logins$/,loginsPage]];
function route(){closeDlg();$('#side').classList.remove('open');const h=location.hash.slice(1)||'/users';
 for(const [re,fn] of ROUTES){const m=h.match(re);if(m){fn(...m.slice(1));window.scrollTo(0,0);return}}
 location.hash='#/users'}
$('#menuBtn').innerHTML=icon('menu',18);
$('#devToggle').addEventListener('change',e=>document.body.classList.toggle('dev',e.target.checked));
window.addEventListener('hashchange',route);
route();
</script></body></html>
