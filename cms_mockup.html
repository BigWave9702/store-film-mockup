<style>

.kidchips{display:flex;flex-wrap:wrap;gap:6px}.kidchips .chipx{background:#fff;cursor:pointer;font:600 12px var(--sans);color:var(--fk);border-color:#cfd3f5}.kidchips .chipx b{font:600 10.5px var(--mono);background:var(--fk-bg);border-radius:99px;padding:0 6px;margin-left:3px}.kidchips .chipx.z{color:#8a94a8;border-color:var(--line)}.kidchips .chipx:hover{background:var(--fk-bg)}

<div class="app"><aside class="side"><div class="brand"><i></i><div>Màn <em>chiếu</em> CMS</div></div><nav id="nav" aria-label="Chức năng"></nav></aside>

function fieldHtml(tn,f,v,o){
 const lock=o.lock&&Object.prototype.hasOwnProperty.call(o.lock,f.k);const ro=f.ro||lock||o.ro||o.forceRo;
 let c='';const nm=`name="${f.k}"`;
 if(f.t==='text')c=`<input type="text" ${nm} value="${esc(v)}" ${ro?'readonly':''}>`;
 else if(f.t==='password')c=`<input type="password" ${nm} value="" placeholder="${v?'•••••••• (giữ nguyên nếu để trống)':'Nhập mật khẩu'}">`;
 else if(f.t==='number')c=`<input type="number" ${nm} value="${esc(v)}" ${ro?'readonly':''}>`;
 else if(f.t==='date')c=`<input type="date" ${nm} value="${esc(v)}">`;

 else if(f.t==='bool')c=`<label class="sw"><input type="checkbox" ${nm} ${v?'checked':''} ${ro?'disabled':''}><i></i><span>${v?'Có':'Không'}</span></label>`;
 else if(f.t==='enum')c=`<select ${nm} ${ro?'disabled':''}>${f.req?'':'<option value="">(không chọn)</option>'}${f.opts.map(op=>`<option value="${esc(op[0])}" ${String(v)===String(op[0])?'selected':''}>${esc(op[1])}</option>`).join('')}</select>${ro?`<input type="hidden" ${nm} value="${esc(v)}">`:''}`;

   labelOf:x=>stat?x:lbl(f.ref,x)})+(f.k==='_dien_vien'?'<div class="roles"></div>':'')}
 else if(f.t==='tags')c=`<div class="chips"><input placeholder="Thêm…" aria-label="${esc(f.label)}"></div><input type="hidden" ${nm} value='${esc(JSON.stringify(v||[]))}'>`;

function formHtml(tn,row,o={}){

 const mk=f=>{if(hide.includes(f.k))return `<input type="hidden" name="${f.k}" value="${esc(vals[f.k]??'')}">`;
  let v=vals[f.k];if(v===undefined)v=vals.id==null?dflt(tn,f.k):null;

function saveRec(tn,id,form){
 const v=validate(form,id);if(!v){toast('Chưa lưu: kiểm tra các trường báo lỗi.');return null}
 const virt=new Set(allFields(tn).filter(f=>f.virtual).map(f=>f.k));let r;
 if(id){r=find(tn,id);for(const k in v){if(virt.has(k))continue;if(k==='mat_khau_hash'&&v[k]==null)continue;if(['ngay_tao','nguoi_tao'].includes(k))continue;if(T[tn].fields.find(f=>f.k===k&&f.ro&&k!=='ma_noi_dung'))continue;r[k]=v[k]}r.ngay_cap_nhat=NOW}
 else{r=Object.assign({},v,{id:nid(tn),da_xoa:false,ngay_tao:NOW,ngay_cap_nhat:null,nguoi_tao:ME});virt.forEach(k=>delete r[k]);

function mapSvg(){

 for(const [c,p,k] of E){const a=box(c),b=box(p);let d;
  if(Math.abs(a.x-b.x)<5){const x=a.x+W;d=`M${x},${a.y+a.h/2} C${x+50},${a.y+a.h/2} ${x+50},${b.y+b.h/2} ${x},${b.y+b.h/2}`}

function buildNav(){
 const cur=location.hash;
 $('#nav').innerHTML=`<a class="home ${cur===''||cur==='#/'||cur==='#'?'on':''}" href="#/">◫ Bản đồ dữ liệu</a>`+GROUPS.filter(g=>ROLES[S.role].includes(g[1])).map(g=>`<div class="grp ${S.shut&&S.shut[g[1]]?'shut':''}" data-g="${g[1]}"><button>${g[0]}<span>▾</span></button><div>${g[2].map(n=>`<a class="nav ${cur.startsWith('#/t/'+n+'/')||cur==='#/t/'+n?'on':''}" href="#/t/${n}">${T[n].vi}<small>${n}</small></a>`).join('')}</div></div>`).join('');
 $$('.grp>button').forEach(b=>b.onclick=()=>{const g=b.parentNode;g.classList.toggle('shut');(S.shut=S.shut||{})[g.dataset.g]=g.classList.contains('shut')})}
function route(){
 closeDrawer();closeModal();
 const m=location.hash.match(/^#\/t\/([a-z_]+)(?:\/([a-z0-9]+))?/);let v,crumb;
 if(m&&T[m[1]]){const tn=m[1],rid=m[2];
  if(HOST[tn]){location.replace(rid&&rid!=='new'?href(tn,rid):HOST[tn][1]);return}
  if(tn==='noi_dung')v=rid?viewContent(rid):viewList(tn);
  else if(tn==='chinh_sach_quyen_xem')v=rid&&rid!=='new'?viewPolicyDetail(+rid):viewPolicyList();
  else v=rid?viewRecord(tn,rid):viewList(tn);
  const gname=(GROUPS.find(g=>g[2].includes(tn))||[''])[0];
  crumb=`<a href="#/">CMS</a> / ${gname} / <b>${T[tn].vi}</b>${rid?' / '+(rid==='new'?'Thêm mới':'#'+rid):''}`}
 else{v=viewHome();crumb='CMS / <b>Bản đồ dữ liệu</b>'}
 $('#crumb').innerHTML=crumb;$('#view').innerHTML=v.html;v.after&&v.after();buildNav();
 if(!route.keep)window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
$('#role').onchange=e=>{S.role=e.target.value;toast('Menu được dựng theo quyền của vai trò: '+e.target.selectedOptions[0].text);buildNav()};
$('#scrim').onclick=closeDrawer;$('#scrim2').onclick=closeModal;
route();
</script></body></html>
